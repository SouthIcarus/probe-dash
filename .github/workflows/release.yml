name: Release

# Builds the beta / prod Play bundle from an owner-created tag
# (environments.md §5 steps 16-23; spec v3 OPS-2, OPS-6). NEVER uploads to
# Play: the owner downloads the AAB and uploads it by hand.
#
#   beta-vX.Y.Z+N  -> beta flavor, Google test ads (ENV-D2)
#   vX.Y.Z+N       -> prod flavor, real ad IDs from secrets
#
# DRY RUN BY DEFAULT. A tag push builds signed only when the owner has set
# the repository VARIABLE PLAY_RELEASE_ENABLED=true (after creating the
# `play-release` environment and its secrets). Otherwise, and for every
# manual run, it signs with a throwaway key, uses test ad IDs, names the
# files NOT-FOR-UPLOAD and keeps them as workflow artifacts only.
#
# Secrets (security review SEC-1, CI-1, CI-2): UPLOAD_*, ADMOB_* (and later
# GOOGLE_SERVICES_JSON) exist ONLY in environment `play-release` (tags v*,
# beta-v* only; owner approval required). Only the `build-signed` job
# declares that environment; no other job and no repo-level secret is used.

on:
  push:
    tags: ['beta-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to rehearse (dry run only), e.g. beta-v0.1.0+1'
        required: true
        default: 'beta-v0.1.0+1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  verify:
    name: Verify tag, version and CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI runs of the tagged commit
    outputs:
      flavor: ${{ steps.v.outputs.flavor }}
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      ads: ${{ steps.v.outputs.ads }}
      app_id: ${{ steps.v.outputs.app_id }}
      artifact: ${{ steps.v.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Verify
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PLAY_RELEASE_ENABLED: ${{ vars.PLAY_RELEASE_ENABLED }}
        run: bash .github/scripts/release-verify.sh

  test:
    name: Analyze and test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  build-dry-run:
    name: Build (dry run, NOT FOR UPLOAD)
    needs: [verify, test]
    if: needs.verify.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ needs.verify.outputs.flavor }}
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      ARTIFACT: ${{ needs.verify.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      # Proves the upload-key signing path without any secret: a fresh key
      # made here, thrown away with the runner (environments.md §5 step 23).
      - name: Make a throwaway signing key
        run: |
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/throwaway.jks" \
            -storetype JKS -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=NOT FOR UPLOAD, O=Probe Dash dry run" \
            -storepass "$pass" -keypass "$pass"
          {
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/throwaway.jks"
            echo "UPLOAD_KEYSTORE_PASSWORD=$pass"
            echo "UPLOAD_KEY_PASSWORD=$pass"
            echo "UPLOAD_KEY_ALIAS=throwaway"
          } >> "$GITHUB_ENV"

      - name: Build AAB and universal APK
        run: bash .github/scripts/release-build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/*.aab
            dist/*.sha256
            dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}-r8-mapping
          path: dist/mapping/
          if-no-files-found: warn
          retention-days: 30

  build-signed:
    name: Build (signed with the upload key)
    needs: [verify, test]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    # The ONLY job that can read release secrets (SEC-1). GitHub runs it
    # only for tags allowed by the environment and after owner approval.
    environment: play-release
    env:
      FLAVOR: ${{ needs.verify.outputs.flavor }}
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      ARTIFACT: ${{ needs.verify.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      # Secrets go in through env only, are written to $RUNNER_TEMP (never
      # the workspace), are never echoed, and are deleted at the end (CI-2).
      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set in environment play-release"; exit 1
          fi
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Write real ad unit IDs (prod only)
        if: env.FLAVOR == 'prod'
        env:
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          umask 077
          python3 -I -c 'import json, os, sys; json.dump({k: os.environ[k] for k in ("ADMOB_REWARDED_ID", "ADMOB_INTERSTITIAL_ID")}, open(sys.argv[1], "w"))' "$RUNNER_TEMP/ad-ids.json"
          echo "AD_IDS_FILE=$RUNNER_TEMP/ad-ids.json" >> "$GITHUB_ENV"

      - name: Build AAB and universal APK
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          # Gradle uses it for the prod manifest only; beta ignores it.
          ADMOB_APP_ID: ${{ env.FLAVOR == 'prod' && secrets.ADMOB_APP_ID || '' }}
        run: bash .github/scripts/release-build.sh

      - name: Delete signing material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/ad-ids.json" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/ad-ids.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/*.aab
            dist/*.sha256
            dist/*.apk
          if-no-files-found: error
          retention-days: 90
      # R8 mapping: a retention-limited workflow artifact, never on the
      # public release (SEC-15, REL-4). Upload it to Play Console by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}-r8-mapping
          path: dist/mapping/
          if-no-files-found: warn
          retention-days: 90

  guards:
    name: Release guards (signer, version, target SDK, 16 KB, permissions, ad IDs)
    needs: [verify, build-dry-run, build-signed]
    if: >-
      !cancelled() && (needs.build-dry-run.result == 'success' ||
      needs.build-signed.result == 'success')
    runs-on: ubuntu-latest
    env:
      ARTIFACT: ${{ needs.verify.outputs.artifact }}
      APP_ID: ${{ needs.verify.outputs.app_id }}
      ADS: ${{ needs.verify.outputs.ads }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: dist
      - name: SHA-256 matches
        working-directory: dist
        run: sha256sum -c "$ARTIFACT.aab.sha256"
      - name: AAB guards (not debug-signed, 16 KB, ad IDs)
        run: bash .github/scripts/check-aab.sh "dist/$ARTIFACT.aab" "$ADS"
      - name: APK guards (package, versionCode, target SDK >= 36, permissions, 16 KB, ad IDs)
        run: bash .github/scripts/check-apk.sh "dist/$ARTIFACT-universal.apk" "$APP_ID" "$ADS" "$BUILD_NUMBER"

  launch:
    name: Opens without crashing (release, Android API ${{ matrix.api-level }})
    needs: [verify, guards]
    if: ${{ !cancelled() && needs.guards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35, 36]
    env:
      ARTIFACT: ${{ needs.verify.outputs.artifact }}
      APP_ID: ${{ needs.verify.outputs.app_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open, and watch for 30 seconds
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/launch-test.sh "dist/$ARTIFACT-universal.apk" "$APP_ID"

  publish:
    name: Publish GitHub release (signed builds only)
    needs: [verify, build-signed, guards, launch]
    # Tag pushes in signed mode only. Dry runs never publish anything.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.verify.outputs.dry_run == 'false' &&
      needs.build-signed.result == 'success' &&
      needs.guards.result == 'success' && needs.launch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; this job runs no build code
    env:
      ARTIFACT: ${{ needs.verify.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist
      # The AAB and its SHA-256 only: no mapping (SEC-15), no APK.
      - name: Publish release (never uploads to Play)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Probe Dash ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.flavor == 'beta' }}
          make_latest: ${{ needs.verify.outputs.flavor == 'prod' }}
          body: |
            ${{ needs.verify.outputs.flavor }} build ${{ needs.verify.outputs.version }} (${{ needs.verify.outputs.build_number }}), commit ${{ github.sha }}.
            Signed with the upload key. The owner uploads the AAB to Play Console by hand; CI never uploads to Play.
            Release checklist: docs/products/probe-dash/releases/${{ needs.verify.outputs.version }}.md in SouthIcarus/AJ_PROBE.
            The R8 mapping file is a workflow artifact of this run (90 days), not attached here.
          files: |
            dist/${{ needs.verify.outputs.artifact }}.aab
            dist/${{ needs.verify.outputs.artifact }}.aab.sha256
          fail_on_unmatched_files: true
