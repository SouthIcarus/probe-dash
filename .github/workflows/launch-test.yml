name: Launch test

# Installs the release APK on an Android emulator, opens it, and fails if
# the app is not still running 30 seconds later. Prints the crash log on
# failure. Catches "app closes on open" bugs that unit tests can't.
# Covers the dev flavor (API 30/35/36; check names unchanged) and the beta
# flavor (API 36), environments.md §5 step 14. Analytics stays off (AN-6).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  launch:
    name: Opens without crashing (${{ matrix.label }}Android API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 30 = Android 11 (oldest common), 35 = Android 15, 36 = Android 16
        # (owner's Galaxy S26). dev keeps the old check names (empty label).
        include:
          - { flavor: dev, label: '', app-id: com.southicarus.probe_dash.dev, api-level: 30 }
          - { flavor: dev, label: '', app-id: com.southicarus.probe_dash.dev, api-level: 35 }
          - { flavor: dev, label: '', app-id: com.southicarus.probe_dash.dev, api-level: 36 }
          - { flavor: beta, label: 'beta, ', app-id: com.southicarus.probe_dash, api-level: 36 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # ANALYTICS=off overrides the config file (a --dart-define wins over
      # --dart-define-from-file): launch tests never send events (AN-6).
      - name: Build release APK (same flavor and config as the published one)
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: >-
          flutter build apk --release --flavor "$FLAVOR"
          --dart-define-from-file="config/$FLAVOR.json"
          --dart-define=ANALYTICS=off

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open, and watch for 30 seconds
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/launch-test.sh build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk ${{ matrix.app-id }}
