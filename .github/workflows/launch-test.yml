name: Launch test

# Installs the release APK on an Android emulator, opens it, and fails if
# the app is not still running 30 seconds later. Prints the crash log on
# failure. Catches "app closes on open" bugs that unit tests can't.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6
  APP_ID: com.southicarus.probe_dash

jobs:
  launch:
    name: Opens without crashing (Android API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 30 = Android 11 (oldest common), 35 = Android 15, 36 = Android 16
        # (owner's Galaxy S26).
        api-level: [30, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build release APK (same as the published one)
        run: flutter build apk --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open, and watch for 30 seconds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/launch-test.sh build/app/outputs/flutter-apk/app-release.apk ${{ env.APP_ID }}
